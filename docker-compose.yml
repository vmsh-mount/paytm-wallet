# One command:  docker compose up --build   (Ctrl-C, then `docker compose down -v` to clean)
# Overridable knobs live in .env (copy .env.example).
services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    # exposed only for local psql poking; the app talks to db:5432 on the compose network
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/wallet
      DATABASE_USER: wallet
      DATABASE_PASSWORD: wallet
      PORT: 8080
      TRANSFER_ENGINE: ${TRANSFER_ENGINE:-conditional-update}
      AUTH_TOKENS: ${AUTH_TOKENS:-dev-token-alice:alice,dev-token-bob:bob}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 45s
    # defense-in-depth: immutable rootfs, writable /tmp only (Tomcat scratch dir)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
