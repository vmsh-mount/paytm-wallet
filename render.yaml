# Render blueprint — free web service + free managed Postgres. ₹0, no card.
# Deploy: push this repo to GitHub, then on render.com "New" -> "Blueprint",
# point at this repo/branch. Render builds the Dockerfile (TASK-10's image) and
# provisions the DB below; nothing else needs console-only configuration except
# the AUTH_TOKENS secret (sync: false — set it once in the dashboard).
#
# DATABASE_URL bridge: Render's `connectionString` is `postgres://user:pass@host/db`;
# RenderDatabaseUrlEnvironmentPostProcessor (see src/main/java/.../config) splits
# it into spring.datasource.{url,username,password} at boot — no shell step needed.
services:
  - type: web
    name: paytm-wallet
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paytm-wallet-db
          property: connectionString
      - key: TRANSFER_ENGINE
        value: conditional-update
      - key: AUTH_TOKENS
        sync: false # set in the Render dashboard; never committed
      - key: DB_POOL_MAX
        value: "5" # free Postgres caps connections low — see docs/WRITEUP.md cost note
        # JAVA_OPTS (container-aware heap) is already baked into the Dockerfile ENV;
        # override here only if Render's free-tier RAM needs a tighter cap.

databases:
  - name: paytm-wallet-db
    plan: free
