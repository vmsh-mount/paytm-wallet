spring:
  application:
    name: p2p-wallet
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DATABASE_USER:wallet}
    password: ${DATABASE_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      pool-name: wallet-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

wallet:
  transfer:
    # conditional-update | select-for-update | serializable
    engine: ${TRANSFER_ENGINE:conditional-update}
    serializable-max-retries: 5
  auth:
    # comma-separated token:userId pairs; override in every real environment
    tokens: ${AUTH_TOKENS:dev-token-alice:alice,dev-token-bob:bob}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # readiness = process up AND the DB reachable (load-balancer + compose gate);
      # liveness = process up (orchestrator restart trigger). Wrong split ⇒ traffic
      # to an app that can't serve, or restart loops on a transient DB blip.
      group:
        readiness:
          include: readinessState, db
      show-details: when_authorized
      show-components: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        # explicit latency buckets so p99 is meaningful on low traffic
        http.server.requests: 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s
  prometheus:
    metrics:
      export:
        enabled: true
