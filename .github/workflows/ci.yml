name: ci
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; GitHub-hosted ubuntu runners ship one.
      - name: mvnw verify
        run: ./mvnw -B verify

      - name: no SNAPSHOT dependencies
        run: |
          ./mvnw -B -q dependency:tree | tee /tmp/tree.txt
          ! grep -q SNAPSHOT /tmp/tree.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t p2p-wallet:ci .

      - name: trivy scan (informational)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 --scanners vuln p2p-wallet:ci

      - name: verify-container.sh (EVAL-O1 + EVAL-O2)
        run: ./scripts/verify-container.sh
