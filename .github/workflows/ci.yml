name: ci
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; GitHub-hosted ubuntu runners ship one.
      - name: mvnw verify
        run: ./mvnw -B verify

      - name: no SNAPSHOT dependencies
        run: |
          ./mvnw -B -q dependency:tree | tee /tmp/tree.txt
          ! grep -q SNAPSHOT /tmp/tree.txt

      - name: docker build
        run: docker build -t paytm-wallet:ci .
